{% extends 'posts/base.html' %}
{% block title %}Eliminar publicación | Blog{% endblock %}
{% block content %}
<section class="tarjeta">
    <h1>¿Eliminar publicación?</h1>
    <p>Vas a eliminar <strong>{{ post.titulo }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="acciones">
            <button class="boton boton-peligro" type="submit">Sí, eliminar</button>
            <a href="{% url 'posts:detalle_post' post.pk %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
